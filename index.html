<!-- Home-screen and tab icons.
     iOS IGNORES SVG favicons for a home-screen shortcut and falls back to a
     letter tile, which is what this page used to get. It wants an
     apple-touch-icon, and it wants it OPAQUE: transparency is composited onto
     black and the image is masked to a rounded rect, so the artwork is inset
     on a solid navy ground.
     The href is ABSOLUTE, and that is load-bearing. Safari honours a relative
     one; Firefox on iOS showed a letter tile with the identical markup, while
     the Home panel -- same tags, but served at a site ROOT -- worked in both.
     The behaviour that explains both is Firefox resolving the href against the
     ORIGIN root rather than this document's directory: at a root those are the
     same URL, on a project page they are not, and brizzlyadams.github.io/
     apple-touch-icon.png is a 404. An absolute URL removes the ambiguity.

<style>
  :root {
    --navy: #1F3864;
    --navy-light: #2F5496;
    --white: #FFFFFF;
    --grey-text: #444444;
    --grey-border: #D8DEE8;
    --grey-bg: #F5F7FA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #111;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 480px; margin: 0 auto; padding-bottom: 84px; }

  header.top {
    background: var(--navy);
    color: var(--white);
    padding: 18px 20px 16px;
    position: sticky; top: 0; z-index: 20;
  }
  header.top h1 {
    margin: 0 0 2px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  header.top .sub {
    font-size: 12.5px;
    color: #C9D4E8;
  }

  .daytoggle {
    display: flex;
    margin: 14px 16px 0;
    background: var(--grey-bg);
    border-radius: 10px;
    padding: 4px;
  }
  .daytoggle button {
    flex: 1;
    border: none;
    background: transparent;
    padding: 10px 0;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--navy);
    border-radius: 8px;
    font-family: inherit;
  }
  .daytoggle button.active {
    background: var(--navy);
    color: var(--white);
  }

  .datebar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 14px 16px 4px;
  }
  .datebar label { font-size: 13px; color: var(--grey-text); font-weight: 600; }
  .datebar input[type="date"] {
    flex: 1;
    padding: 8px 10px;
    border: 1.5px solid var(--grey-border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    color: #111;
  }

  .exlist { padding: 8px 16px 4px; }
  .excard {
    border: 1.5px solid var(--grey-border);
    border-radius: 12px;
    padding: 12px 14px 14px;
    margin-bottom: 12px;
    background: var(--white);
  }
  .excard .exname {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 2px;
  }
  .excard .extarget {
    font-size: 12.5px;
    color: var(--grey-text);
    margin-bottom: 10px;
  }
  .setsrow { display: flex; gap: 8px; }
  .setcol { flex: 1; text-align: center; }
  .setcol .setlabel {
    font-size: 11px;
    color: #7A8296;
    font-weight: 700;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .setcol input {
    width: 100%;
    border: 1.5px solid var(--navy-light);
    border-radius: 8px;
    padding: 8px 4px;
    text-align: center;
    font-size: 15px;
    font-family: inherit;
    margin-bottom: 5px;
  }
  .setcol input::placeholder { color: #B7C0D1; }
  .setcol input.reps { border-color: var(--grey-border); }

  .savebar {
    padding: 10px 16px 4px;
  }
  .savebtn {
    width: 100%;
    background: var(--navy);
    color: var(--white);
    border: none;
    border-radius: 10px;
    padding: 15px 0;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
  }
  .savebtn:active { background: var(--navy-light); }
  .savemsg {
    text-align: center;
    color: var(--navy);
    font-weight: 700;
    font-size: 13.5px;
    margin-top: 8px;
    min-height: 18px;
  }

  .viewpad { padding: 14px 16px 20px; }
  .viewpad h2 {
    font-size: 15px;
    color: var(--navy);
    margin: 6px 0 12px;
  }
  .empty {
    color: #8A93A6;
    font-size: 14px;
    text-align: center;
    padding: 40px 20px;
  }

  .session {
    border: 1.5px solid var(--grey-border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .session .shead {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    color: var(--navy);
    font-size: 13.5px;
    margin-bottom: 6px;
  }
  .session .sline {
    font-size: 13px;
    color: #333;
    padding: 2px 0;
  }
  .session .sline b { color: var(--navy); }

  .progcard {
    border: 1.5px solid var(--grey-border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .progcard .pname {
    font-weight: 700;
    color: var(--navy);
    font-size: 14.5px;
    margin-bottom: 4px;
  }
  .progcard .pline { font-size: 13px; color: #333; }
  .progcard .pline.dim { color: #8A93A6; }

  nav.bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    background: var(--white);
    border-top: 1.5px solid var(--grey-border);
    z-index: 20;
  }
  nav.bottom button {
    flex: 1;
    padding: 12px 0 10px;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: #8A93A6;
  }
  nav.bottom button.active { color: var(--navy); }
  nav.bottom button .dot {
    display: block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--navy);
    margin: 0 auto 5px;
    opacity: 0;
  }
  nav.bottom button.active .dot { opacity: 1; }

  .vartoggle {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .varbtn {
    border: 1.5px solid var(--grey-border);
    background: var(--grey-bg);
    color: var(--navy);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 20px;
    font-family: inherit;
  }
  .varbtn.active {
    background: var(--navy);
    border-color: var(--navy);
    color: var(--white);
  }

  .delbtn {
    display: block;
    margin-top: 8px;
    background: none;
    border: none;
    color: #B23B3B;
    font-size: 12.5px;
    font-weight: 700;
    font-family: inherit;
    padding: 4px 0;
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Upper-Body Tracker</h1>
    <div class="sub" id="headerSub">2-day upper-body strength plan</div>
  </header>

  <div id="view-log"></div>
  <div id="view-history" style="display:none;"></div>
  <div id="view-progress" style="display:none;"></div>

  <nav class="bottom">
    <button id="tab-log" class="active"><span class="dot"></span>Log</button>
    <button id="tab-history"><span class="dot"></span>History</button>
    <button id="tab-progress"><span class="dot"></span>Progress</button>
  </nav>
</div>

<script>
const DAY_A = [
  {code:'CP', name:'Chest press (machine or barbell)', target:'40kg · 3 x 8', variants:[
    {label:'Machine', type:'weight', suggested:40},
    {label:'Barbell', type:'weight', suggested:40},
  ]},
  {code:'SP', name:'Seated shoulder press', target:'37kg · 3 x 8', variants:[
    {label:'Seated shoulder press', type:'weight', suggested:37},
  ]},
  {code:'CR', name:'Seated cable row or single-arm row', target:'Moderate · 3 x 10', variants:[
    {label:'Seated cable row', type:'weight', suggested:null},
    {label:'Single-arm row', type:'weight', suggested:null},
  ]},
  {code:'TP', name:'Triceps pushdown', target:'Light-mod · 2-3 x 10-12', variants:[
    {label:'Triceps pushdown', type:'weight', suggested:null},
  ]},
  {code:'RD', name:'Rear delt fly or face pull', target:'Light · 2 x 12-15', variants:[
    {label:'Rear delt fly', type:'weight', suggested:null},
    {label:'Face pull', type:'weight', suggested:null},
  ]},
  {code:'PL', name:'Plank or dead bug', target:'Plank: 20-30s hold · Dead bug: 8/side · 2-3 sets', variants:[
    {label:'Plank', type:'time'},
    {label:'Dead bug', type:'reps'},
  ]},
];
const DAY_B = [
  {code:'LP', name:'Lat pulldown', target:'30kg · 3 x 8-10', variants:[
    {label:'Lat pulldown', type:'weight', suggested:30},
  ]},
  {code:'CS', name:'Chest-supported row or seated cable row', target:'Moderate · 3 x 8-10', variants:[
    {label:'Chest-supported row', type:'weight', suggested:null},
    {label:'Seated cable row', type:'weight', suggested:null},
  ]},
  {code:'DB', name:'Incline or flat dumbbell press', target:'Moderate · 2-3 x 10', variants:[
    {label:'Incline dumbbell press', type:'weight', suggested:null},
    {label:'Flat dumbbell press', type:'weight', suggested:null},
  ]},
  {code:'BC', name:'Biceps curl', target:'Light-mod · 2-3 x 10-12', variants:[
    {label:'Biceps curl', type:'weight', suggested:null},
  ]},
  {code:'FP', name:'Face pull or band pull-apart', target:'Light · 2 x 15', variants:[
    {label:'Face pull', type:'weight', suggested:null},
    {label:'Band pull-apart', type:'weight', suggested:null},
  ]},
  {code:'LG', name:'Leg press (light maintenance)', target:'Light-mod · 2 x 10', variants:[
    {label:'Leg press', type:'weight', suggested:null},
  ]},
  {code:'CO', name:'Core (dead bug / bird dog)', target:'Dead bug or bird dog: 8/side · 2-3 sets', variants:[
    {label:'Dead bug', type:'reps'},
    {label:'Bird dog', type:'reps'},
  ]},
];
const ALL_EX = [...DAY_A.map(e => ({...e, day:'A'})), ...DAY_B.map(e => ({...e, day:'B'}))];

let currentDay = 'A';
let history = [];
let activeTab = 'log';

function todayStr() {
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function emptyDraftForDay() {
  return { date: todayStr(), dateTouched: false, variants: {}, values: {} };
}
let draft = { A: emptyDraftForDay(), B: emptyDraftForDay() };

function loadDraft() {
  try {
    const raw = localStorage.getItem('workout_draft');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed.A) draft.A = parsed.A;
      if (parsed.B) draft.B = parsed.B;
    }
  } catch (e) {
    // keep defaults
  }
}

function saveDraft() {
  try {
    localStorage.setItem('workout_draft', JSON.stringify(draft));
  } catch (e) {
    console.error('Storage error', e);
  }
}

function valueKey(code, variantLabel) { return code + '__' + variantLabel; }

async function loadHistory() {
  try {
    const raw = localStorage.getItem('workout_history');
    const parsed = raw ? JSON.parse(raw) : [];
    history = parsed.map(sess => {
      const sets = {};
      Object.keys(sess.sets || {}).forEach(code => {
        const rec = sess.sets[code];
        if (Array.isArray(rec)) {
          // legacy format: sets[code] was a plain array of {w,r} entries
          const ex = ALL_EX.find(e => e.code === code);
          const variantLabel = (ex && ex.variants[0]) ? ex.variants[0].label : code;
          sets[code] = {
            variant: variantLabel,
            entries: rec.map(e => ({ w: e.w || '', r: e.r || '', t: '' })),
          };
        } else {
          sets[code] = rec;
        }
      });
      return { ...sess, sets };
    });
  } catch (e) {
    history = [];
  }
}

async function saveHistory() {
  try {
    localStorage.setItem('workout_history', JSON.stringify(history));
  } catch (e) {
    console.error('Storage error', e);
  }
}

function exList(day) { return day === 'A' ? DAY_A : DAY_B; }

function getLastEntryForVariant(code, variantLabel) {
  for (let i = history.length - 1; i >= 0; i--) {
    const rec = history[i].sets && history[i].sets[code];
    if (rec && rec.variant === variantLabel) {
      return { date: history[i].date, entries: rec.entries };
    }
  }
  return null;
}

function getLastUsedVariantLabel(code) {
  for (let i = history.length - 1; i >= 0; i--) {
    const rec = history[i].sets && history[i].sets[code];
    if (rec && rec.variant) return rec.variant;
  }
  return null;
}

function formatEntries(entries, type) {
  return entries.map(e => {
    if (type === 'time') return (e.t !== '' && e.t != null) ? `${e.t}s` : '–';
    if (type === 'reps') return (e.r !== '' && e.r != null) ? `${e.r} reps` : '–';
    return `${e.w || '–'}×${e.r || '–'}`;
  }).join(', ');
}

function renderLog() {
  const el = document.getElementById('view-log');
  const list = exList(currentDay);
  const d = draft[currentDay];
  if (!d.dateTouched) d.date = todayStr();
  let html = `
    <div class="daytoggle">
      <button id="btnDayA" class="${currentDay==='A' ? 'active':''}">Day A</button>
      <button id="btnDayB" class="${currentDay==='B' ? 'active':''}">Day B</button>
    </div>
    <div class="datebar">
      <label for="sessionDate">Date</label>
      <input type="date" id="sessionDate" value="${d.date}">
    </div>
    <div class="exlist">
  `;
  list.forEach(ex => {
    const selectedLabel = d.variants[ex.code] || getLastUsedVariantLabel(ex.code) || ex.variants[0].label;
    const variant = ex.variants.find(v => v.label === selectedLabel) || ex.variants[0];
    const vKey = valueKey(ex.code, variant.label);
    const draftEntries = d.values[vKey] || [];
    const lastEntry = getLastEntryForVariant(ex.code, variant.label);

    html += `
      <div class="excard">
        <div class="exname">${ex.code} · ${ex.name}</div>
        <div class="extarget">Target: ${ex.target}</div>
    `;

    if (ex.variants.length > 1) {
      html += `<div class="vartoggle">`;
      ex.variants.forEach(v => {
        html += `<button class="varbtn ${v.label === variant.label ? 'active' : ''}" data-code="${ex.code}" data-variant="${v.label}">${v.label}</button>`;
      });
      html += `</div>`;
    }

    html += `<div class="setsrow">`;
    for (let n = 1; n <= 3; n++) {
      const draftSet = draftEntries[n-1] || {};
      const lastSet = (lastEntry && lastEntry.entries[n-1]) || {};
      html += `<div class="setcol"><div class="setlabel">Set ${n}</div>`;
      if (variant.type === 'weight') {
        const wVal = (draftSet.w !== undefined && draftSet.w !== '') ? draftSet.w : (lastSet.w || '');
        const rVal = draftSet.r !== undefined ? draftSet.r : '';
        html += `<input type="text" inputmode="decimal" class="fld" data-code="${ex.code}" data-variant="${variant.label}" data-set="${n}" data-field="w" placeholder="kg" value="${wVal}">`;
        html += `<input type="text" inputmode="numeric" class="fld reps" data-code="${ex.code}" data-variant="${variant.label}" data-set="${n}" data-field="r" placeholder="reps" value="${rVal}">`;
      } else if (variant.type === 'time') {
        const tVal = draftSet.t !== undefined ? draftSet.t : '';
        html += `<input type="text" inputmode="numeric" class="fld reps" data-code="${ex.code}" data-variant="${variant.label}" data-set="${n}" data-field="t" placeholder="sec" value="${tVal}">`;
      } else {
        const rVal = draftSet.r !== undefined ? draftSet.r : '';
        html += `<input type="text" inputmode="numeric" class="fld reps" data-code="${ex.code}" data-variant="${variant.label}" data-set="${n}" data-field="r" placeholder="reps" value="${rVal}">`;
      }
      html += `</div>`;
    }
    html += `</div></div>`;
  });
  html += `
    </div>
    <div class="savebar">
      <button class="savebtn" id="saveBtn">Save Session</button>
      <div class="savemsg" id="saveMsg"></div>
    </div>
  `;
  el.innerHTML = html;

  document.getElementById('btnDayA').onclick = () => { currentDay = 'A'; renderLog(); };
  document.getElementById('btnDayB').onclick = () => { currentDay = 'B'; renderLog(); };
  document.getElementById('saveBtn').onclick = onSave;
  document.getElementById('sessionDate').oninput = (e) => {
    draft[currentDay].date = e.target.value;
    draft[currentDay].dateTouched = true;
    saveDraft();
  };

  el.querySelectorAll('.varbtn').forEach(btn => {
    btn.onclick = () => {
      draft[currentDay].variants[btn.dataset.code] = btn.dataset.variant;
      saveDraft();
      renderLog();
    };
  });

  el.querySelectorAll('.fld').forEach(inp => {
    inp.oninput = () => {
      const { code, variant, set, field } = inp.dataset;
      const vKey = valueKey(code, variant);
      if (!draft[currentDay].values[vKey]) draft[currentDay].values[vKey] = [{}, {}, {}];
      draft[currentDay].values[vKey][parseInt(set, 10) - 1][field] = inp.value;
      saveDraft();
    };
  });
}

async function onSave() {
  const d = draft[currentDay];
  const date = d.date || todayStr();
  const list = exList(currentDay);
  const sets = {};
  let anyFilled = false;

  list.forEach(ex => {
    const selectedLabel = d.variants[ex.code] || getLastUsedVariantLabel(ex.code) || ex.variants[0].label;
    const variant = ex.variants.find(v => v.label === selectedLabel) || ex.variants[0];
    const vKey = valueKey(ex.code, variant.label);
    const rawEntries = d.values[vKey] || [];
    const entries = [];

    for (let n = 0; n < 3; n++) {
      const raw = rawEntries[n] || {};
      const w = (raw.w || '').trim();
      const r = (raw.r || '').trim();
      const t = (raw.t || '').trim();
      const filled = variant.type === 'weight' ? (w !== '' || r !== '')
        : variant.type === 'time' ? (t !== '')
        : (r !== '');
      if (filled) {
        entries.push({ w, r, t });
        anyFilled = true;
      }
    }
    if (entries.length > 0) sets[ex.code] = { variant: variant.label, entries };
  });

  if (!anyFilled) {
    document.getElementById('saveMsg').textContent = 'Enter at least one set before saving.';
    return;
  }

  history.push({ date, day: currentDay, sets });
  await saveHistory();

  draft[currentDay] = emptyDraftForDay();
  saveDraft();
  renderLog();

  const msgEl = document.getElementById('saveMsg');
  msgEl.textContent = 'Saved!';
  setTimeout(() => { const m = document.getElementById('saveMsg'); if (m) m.textContent = ''; }, 2000);
}

function exNameByCode(code) {
  const found = ALL_EX.find(e => e.code === code);
  return found ? found.name : code;
}

function renderHistory() {
  const el = document.getElementById('view-history');
  const indexed = history.map((s, i) => ({ s, i })).sort((a,b) => (a.s.date < b.s.date ? 1 : -1));
  let html = `<div class="viewpad"><h2>Past sessions</h2>`;
  if (indexed.length === 0) {
    html += `<div class="empty">No sessions logged yet.<br>Log your first one from the Log tab.</div>`;
  } else {
    indexed.forEach(({ s, i }) => {
      html += `<div class="session"><div class="shead"><span>${s.date}</span><span>Day ${s.day}</span></div>`;
      Object.keys(s.sets).forEach(code => {
        const ex = ALL_EX.find(e => e.code === code);
        const rec = s.sets[code];
        const variant = ex ? ex.variants.find(v => v.label === rec.variant) : null;
        const type = variant ? variant.type : 'weight';
        const setsStr = formatEntries(rec.entries, type);
        const variantTag = (ex && ex.variants.length > 1 && rec.variant) ? `${rec.variant}: ` : '';
        html += `<div class="sline"><b>${code}</b> — ${variantTag}${setsStr}</div>`;
      });
      html += `<button class="delbtn" data-idx="${i}">Delete session</button>`;
      html += `</div>`;
    });
  }
  html += `</div>`;
  el.innerHTML = html;

  el.querySelectorAll('.delbtn').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Delete this session? This cannot be undone.')) return;
      const idx = parseInt(btn.dataset.idx, 10);
      history.splice(idx, 1);
      await saveHistory();
      renderHistory();
    };
  });
}

function computeBestForVariant(code, variant) {
  let best = null;
  let setsLogged = 0;
  history.forEach(s => {
    const rec = s.sets && s.sets[code];
    if (rec && rec.variant === variant.label) {
      rec.entries.forEach(entry => {
        setsLogged++;
        const raw = variant.type === 'time' ? entry.t
          : variant.type === 'reps' ? entry.r
          : entry.w;
        const val = parseFloat(raw);
        if (!isNaN(val)) {
          if (best === null || val > best) best = val;
        }
      });
    }
  });
  return { best, setsLogged };
}

function renderProgress() {
  const el = document.getElementById('view-progress');
  let html = `<div class="viewpad"><h2>Best logged so far</h2>`;
  ALL_EX.forEach(ex => {
    html += `<div class="progcard"><div class="pname">${ex.code} · ${ex.name}</div>`;
    ex.variants.forEach(v => {
      const { best, setsLogged } = computeBestForVariant(ex.code, v);
      const unit = v.type === 'time' ? 's' : (v.type === 'reps' ? ' reps' : 'kg');
      const prefix = ex.variants.length > 1 ? `<b>${v.label}</b> — ` : '';
      if (v.type === 'weight' && v.suggested !== null) {
        html += `<div class="pline dim">${ex.variants.length > 1 ? v.label + ' suggested' : 'Suggested'}: ${v.suggested}kg</div>`;
      }
      if (setsLogged === 0) {
        html += `<div class="pline dim">${prefix}Not logged yet</div>`;
      } else {
        const bestLabel = v.type === 'time' ? 'Best hold' : 'Best';
        html += `<div class="pline">${prefix}${bestLabel}: ${best !== null ? best + unit : '–'} &nbsp;·&nbsp; ${setsLogged} sets logged</div>`;
      }
    });
    html += `</div>`;
  });
  html += `
    <div class="progcard">
      <div class="pname">Backup &amp; Restore</div>
      <div class="pline dim">Your history lives only on this device. A Home Screen app keeps its own copy, and <b>deleting the icon deletes the data</b> — so keep a backup somewhere else.</div>
      <button class="savebtn" id="downloadBackupBtn" style="margin-top:8px;">Download backup file</button>
      <button class="savebtn" id="copyBackupBtn" style="margin-top:8px;">Copy backup text</button>
      <textarea id="backupOutput" readonly style="width:100%;margin-top:8px;height:70px;border:1.5px solid var(--grey-border);border-radius:8px;padding:8px;font-family:monospace;font-size:11px;box-sizing:border-box;">${backupText().replace(/</g, '&lt;')}</textarea>
      <div class="savemsg" id="backupMsg"></div>
      <div class="pline dim" style="margin-top:14px;">Restore from a file:</div>
      <input type="file" id="restoreFile" accept="application/json,.json" style="margin-top:6px;font-size:12px;">
      <div class="pline dim" style="margin-top:12px;">…or paste a backup:</div>
      <textarea id="restoreInput" placeholder="Paste backup text here" style="width:100%;margin-top:8px;height:70px;border:1.5px solid var(--grey-border);border-radius:8px;padding:8px;font-family:monospace;font-size:11px;box-sizing:border-box;"></textarea>
      <button class="savebtn" id="restoreBtn" style="margin-top:8px;background:#8A93A6;">Restore from Backup</button>
    </div>
  `;
  html += `</div>`;
  el.innerHTML = html;

  const bMsg = () => document.getElementById('backupMsg');
  const dlBtn = document.getElementById('downloadBackupBtn');
  if (dlBtn) dlBtn.onclick = () => downloadBackup(bMsg());

  const cpBtn = document.getElementById('copyBackupBtn');
  if (cpBtn) cpBtn.onclick = async () => {
    const m = bMsg();
    try {
      await navigator.clipboard.writeText(backupText());
      m.textContent = 'Copied! Paste it somewhere safe.';
    } catch (e) {
      m.textContent = 'Auto-copy blocked — tap the text box above, select all, and copy manually.';
    }
    setTimeout(() => { if (m) m.textContent = ''; }, 4000);
  };

  const fileInput = document.getElementById('restoreFile');
  if (fileInput) fileInput.onchange = () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { bMsg().textContent = restoreFromText(String(r.result)); fileInput.value = ''; };
    r.onerror = () => { bMsg().textContent = 'Could not read that file.'; };
    r.readAsText(f);
  };

  const rsBtn = document.getElementById('restoreBtn');
  if (rsBtn) rsBtn.onclick = () => {
    const input = document.getElementById('restoreInput').value.trim();
    if (!input) { bMsg().textContent = 'Paste a backup first.'; return; }
    bMsg().textContent = restoreFromText(input);
  };
}

// ---- Backup & Restore ----------------------------------------------------
// FOUR routes on purpose, because the failure this guards against is real and
// silent: a page with apple-mobile-web-app-capable gets a storage sandbox of
// its own when added to the Home Screen, and DELETING THE SHORTCUT DELETES THE
// DATA. No warning, no undo. Downloads can also misbehave inside a standalone
// web app on iOS, so the clipboard route is kept as the one that always works.
//
// Backups carry an envelope {app, v, exported, data} so a future format change
// is detectable rather than silently mis-restored. Restore still accepts the
// older bare payload, so backups taken before this existed keep working.
const BACKUP_APP = 'workout-tracker';
const BACKUP_V = 1;

function backupText() {
  return JSON.stringify({
    app: BACKUP_APP, v: BACKUP_V, exported: new Date().toISOString(),
    data: backupData()
  }, null, 2);
}

function backupFilename() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return BACKUP_APP + '-' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate())
       + '-' + p(d.getHours()) + p(d.getMinutes()) + '.json';
}

function downloadBackup(msgEl) {
  try {
    const blob = new Blob([backupText()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = backupFilename();
    document.body.appendChild(a); a.click(); a.remove();
    // Revoked late: Safari can still be reading the blob when click() returns.
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    if (msgEl) msgEl.textContent = 'Saved ' + backupFilename();
  } catch (e) {
    if (msgEl) msgEl.textContent = 'Download blocked — use Copy backup text instead.';
  }
}

// Accepts the envelope or a legacy bare payload. Returns a message string.
function restoreFromText(text) {
  let parsed;
  try { parsed = JSON.parse(text); }
  catch (e) { return "That doesn't look like a valid backup."; }
  if (parsed && parsed.app && parsed.data !== undefined) {
    if (parsed.app !== BACKUP_APP) return 'That backup is from ' + parsed.app + ', not this app.';
    return applyBackup(parsed.data);
  }
  return applyBackup(parsed);          // legacy, pre-envelope
}

function backupData() { return history; }

function applyBackup(data) {
  if (!Array.isArray(data)) return "That doesn't look like a valid backup.";
  history = data;
  saveHistory();
  renderProgress();
  return 'Restored ' + data.length + ' entries.';
}

function showTab(tab) {
  activeTab = tab;
  document.getElementById('view-log').style.display = tab === 'log' ? '' : 'none';
  document.getElementById('view-history').style.display = tab === 'history' ? '' : 'none';
  document.getElementById('view-progress').style.display = tab === 'progress' ? '' : 'none';
  document.getElementById('tab-log').classList.toggle('active', tab === 'log');
  document.getElementById('tab-history').classList.toggle('active', tab === 'history');
  document.getElementById('tab-progress').classList.toggle('active', tab === 'progress');
  if (tab === 'history') renderHistory();
  if (tab === 'progress') renderProgress();
}

document.getElementById('tab-log').onclick = () => showTab('log');
document.getElementById('tab-history').onclick = () => showTab('history');
document.getElementById('tab-progress').onclick = () => showTab('progress');

(async function init() {
  await loadHistory();
  loadDraft();
  renderLog();
  showTab('log');
})();
</script>
